{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="page-heading"><div><p class="eyebrow">SUPPLY REPLENISHMENT</p><h1>{{ title }}</h1><p>{{ description }}</p></div></header>
<section class="form-section">
  <div class="form-section-heading"><span class="section-index">01</span><div><h2>{{ form_heading }}</h2><p>Stock updates are shared immediately across the network.</p></div></div>
  <form method="post" class="form-stack stock-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid"><div><label for="item">SUPPLY NAME</label><input id="item" name="item" placeholder="For example, water or first aid kits" required></div><div><label for="quantity">QUANTITY RECEIVED</label><input id="quantity" name="quantity" type="number" min="1" step="1" placeholder="0" required></div></div>
    <button class="button button-primary" type="submit">{{ submit_label }} <span aria-hidden="true">&rarr;</span></button>
  </form>
</section>
{% endblock %}
